name: Split Kanzul Ummal Safe BN

on:
  push:
    paths:
      - 'data/কানযুল উম্মাল.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Split with Bangla Numbers
        run: |
          python3 << 'PY'
          import json
          from pathlib import Path
          import os, re

          INPUT = Path("data/কানযুল উম্মাল.json")
          OUTPUT_DIR = Path("books/kanzulUmmal")

          # ইংরেজি -> বাংলা সংখ্যা
          en_bn = str.maketrans("0123456789", "০১২৩৪৫৬৭৮৯")
          def to_bn(n):
              return str(n).translate(en_bn)

          def extract_number(title, fallback):
              # "কানযুল উম্মাল ১" থেকে ১ বের করবে, না পেলে fallback
              m = re.search(r'(\d+)', title)
              if m:
                  return int(m.group(1))
              return fallback

          with open(INPUT, 'r', encoding='utf-8') as f:
              data = json.load(f)

          print(f"Total: {len(data)}")

          INNER_CHUNK = 100
          OUTER_CHUNK = 5000
          OUTPUT_DIR.mkdir(parents=True, exist_ok=True)

          # clean old
          for p in OUTPUT_DIR.glob("*.json"):
              p.unlink()
          if Path("books/kanzulUmmal.json").exists():
              Path("books/kanzulUmmal.json").unlink()

          inner_chunks = []

          for i in range(0, len(data), INNER_CHUNK):
              chunk = data[i:i+INNER_CHUNK]
              start = i + 1
              end = i + len(chunk)

              combined_blocks = []
              for idx, item in enumerate(chunk):
                  real_num = extract_number(item.get("title",""), start + idx)
                  bn_num = to_bn(real_num)
                  hadith = item.get("hadith","").strip()

                  # নতুন ফরম্যাট: কানযুল উম্মাল হাদিস নং: ১
                  block = f"কানযুল উম্মাল হাদিস নং: {bn_num}\n{hadith}"
                  combined_blocks.append(block)

              # Title এখন বাংলা সংখ্যায়
              chunk_title = f"কানযুল উম্মাল হাদিস {to_bn(start)} থেকে {to_bn(end)}"

              inner_chunks.append({
                  "1": chunk_title,
                  "2": "\n\n".join(combined_blocks)
              })

          # 5000 করে ফাইল
          per_file = OUTER_CHUNK // INNER_CHUNK
          file_list = []

          for fi in range(0, len(inner_chunks), per_file):
              slice_data = inner_chunks[fi:fi+per_file]
              s = fi * INNER_CHUNK + 1
              e = s + len(slice_data) * INNER_CHUNK - 1
              if e > len(data):
                  e = len(data)

              fname = f"kanzulUmmal-{s}-{e}.json"
              fpath = OUTPUT_DIR / fname

              with open(fpath, 'w', encoding='utf-8') as out:
                  json.dump(slice_data, out, ensure_ascii=False, separators=(',', ':'))

              file_list.append(fname)
              print(f"Created {fname} - {os.path.getsize(fpath)/1024/1024:.2f} MB")

          with open(OUTPUT_DIR / "index.json", 'w', encoding='utf-8') as idx:
              json.dump(file_list, idx, ensure_ascii=False, indent=2)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add books/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "build: kanzul with Bangla numbers and fixed format"
            git push
          fi
