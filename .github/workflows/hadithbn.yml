name: Scrape Kanzul Ummal

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Scrape and Build JSON
        run: |
          cat > scrape.py << 'PYEOF'
          import requests, re, html, os, json, time
          from bs4 import BeautifulSoup

          BOOK_ID = "10"
          BASE_URL = f"https://hadithbn.com/h/{BOOK_ID}"
          BOOK_NAME_BN = "সহীহ ইবনু খুযাইমাহ"
          HEADERS = {"User-Agent": "Mozilla/5.0"}

          def to_bn(n):
              return str(n).translate(str.maketrans("0123456789","০১২৩৪৫৬৭৮৯"))

          def clean_hadith(raw):
              # 1. html decode
              t = html.unescape(raw)
              t = re.sub(r'<br\s*/?>', '\n', t, flags=re.I)
              t = re.sub(r'<[^>]+>', '', t)
              
              lines = t.split('\n')
              final_lines = []
              for line in lines:
                  line = line.strip()
                  if not line:
                      continue
                  # 📖 এবং 🔗 লাইন বাদ
                  if '📖' in line or '🔗' in line or 'hadithbn.com' in line or 'https://' in line:
                      continue
                  # 📝 ইমোজি বাদ
                  line = line.replace('📝', '').strip()
                  # &quot; -> " already decoded
                  final_lines.append(line)
              
              # Join with double line break to keep আরবি ও বাংলা আলাদা
              cleaned = "\n\n".join(final_lines)
              # একাধিক স্পেস ক্লিন
              cleaned = re.sub(r'[ \t]+', ' ', cleaned)
              cleaned = re.sub(r'\n \n', '\n\n', cleaned)
              return cleaned.strip()

          session = requests.Session()
          all_data = []
          start = 1
          step = 20

          while True:
              end = start + step - 1
              url = f"{BASE_URL}/{start}-{end}"
              print(f"Fetching {url}")
              try:
                  r = session.get(url, headers=HEADERS, timeout=20)
                  if r.status_code == 404:
                      break
                  r.raise_for_status()
              except Exception as e:
                  print(f"Stop: {e}")
                  break

              soup = BeautifulSoup(r.text, 'lxml')
              btns = soup.select('button.copy-btn[data-text]')
              if not btns:
                  print("No more data")
                  break

              for btn in btns:
                  raw = btn.get('data-text','')
                  if not raw:
                      continue
                  
                  # নাম্বার বের করা
                  m = re.search(r'#\s*(\d+)', raw)
                  if not m:
                      m = re.search(r'(\d+)\s*-', raw)
                  num = int(m.group(1)) if m else 0
                  if num == 0:
                      continue

                  hadith_text = clean_hadith(raw)

                  # তোমার চাওয়া ফাইনাল ২ টা key
                  obj = {
                      "title": f"{BOOK_NAME_BN} {to_bn(num)}",
                      "hadith": hadith_text
                  }
                  all_data.append(obj)

              start += step
              time.sleep(0.8)

          # নাম্বার অনুযায়ী sort
          def get_num(x):
              mm = re.search(r'(\d+)', x['title'])
              # বাংলা নাম্বার থেকে ইংরেজি
              bn = "০১২৩৪৫৬৭৮৯"
              en = "0123456789"
              if mm:
                  # title is already Bangla, convert back for sort
                  t = x['title']
                  for b,e in zip(bn,en):
                      t = t.replace(b,e)
                  m2 = re.search(r'(\d+)', t)
                  return int(m2.group(1)) if m2 else 0
              return 0

          all_data = sorted(all_data, key=get_num)

          os.makedirs("data", exist_ok=True)
          out_path = f"data/{BOOK_NAME_BN}.json"
          with open(out_path, "w", encoding="utf-8") as f:
              json.dump(all_data, f, ensure_ascii=False, indent=2)

          print(f"Saved {len(all_data)} -> {out_path}")
          PYEOF
          python scrape.py

      - name: Commit JSON
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "update: কানযুল উম্মাল json"
          git push
